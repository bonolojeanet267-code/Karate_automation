name: Jira Integration - Update Test Results

on:
  workflow_run:
    workflows: ["E2E Testing Framework"]
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  update-jira:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    steps:
      - name: Download Playwright test reports
        uses: actions/download-artifact@v4
        with:
          name: playwright-test-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: playwright-reports

      - name: Parse Playwright results
        id: playwright
        shell: pwsh
        run: |
          $jsonPath = "playwright-reports/test-results.json"
          $junitPath = "playwright-reports/junit.xml"
          
          if (Test-Path $jsonPath) {
            Write-Host "Found JSON report at: $jsonPath"
            $results = Get-Content $jsonPath -Raw | ConvertFrom-Json
            
            if ($results.stats) {
              $total = $results.stats.tests
              $passed = $results.stats.passed
              $failed = $results.stats.failed
              $skipped = $results.stats.skipped
            } elseif ($results.suites) {
              $total = 0
              $passed = 0
              $failed = 0
              $skipped = 0
              
              foreach ($suite in $results.suites) {
                foreach ($spec in $suite.specs) {
                  $total++
                  if ($spec.ok) {
                    $passed++
                  } elseif ($spec.tests[0].results[0].status -eq "skipped") {
                    $skipped++
                  } else {
                    $failed++
                  }
                }
              }
            } else {
              $total = ($results.suites | Measure-Object).Count
              $passed = ($results.suites | Where-Object { $_.ok -eq $true }).Count
              $failed = $total - $passed
              $skipped = 0
            }
            
            echo "total=$total" >> $env:GITHUB_OUTPUT
            echo "passed=$passed" >> $env:GITHUB_OUTPUT
            echo "failed=$failed" >> $env:GITHUB_OUTPUT
            echo "skipped=$skipped" >> $env:GITHUB_OUTPUT
            echo "exists=true" >> $env:GITHUB_OUTPUT
            
            Write-Host "Results: $passed/$total passed, $failed failed, $skipped skipped"
          }
          elseif (Test-Path $junitPath) {
            Write-Host "Found JUnit report at: $junitPath"
            [xml]$results = Get-Content $junitPath
            
            if ($results.testsuites) {
              $total = [int]$results.testsuites.tests
              $failed = [int]$results.testsuites.failures
              $skipped = [int]$results.testsuites.skipped
            } elseif ($results.testsuite) {
              $total = [int]$results.testsuite.tests
              $failed = [int]$results.testsuite.failures
              $skipped = [int]$results.testsuite.skipped
            } else {
              $total = 0
              $failed = 0
              $skipped = 0
            }
            
            $passed = $total - $failed - $skipped
            
            echo "total=$total" >> $env:GITHUB_OUTPUT
            echo "passed=$passed" >> $env:GITHUB_OUTPUT
            echo "failed=$failed" >> $env:GITHUB_OUTPUT
            echo "skipped=$skipped" >> $env:GITHUB_OUTPUT
            echo "exists=true" >> $env:GITHUB_OUTPUT
            
            Write-Host "Results: $passed/$total passed, $failed failed, $skipped skipped"
          }
          else {
            Write-Host "No Playwright report found"
            echo "total=0" >> $env:GITHUB_OUTPUT
            echo "passed=0" >> $env:GITHUB_OUTPUT
            echo "failed=0" >> $env:GITHUB_OUTPUT
            echo "skipped=0" >> $env:GITHUB_OUTPUT
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Update Xray Test Results
        if: ${{ steps.playwright.outputs.exists == 'true' && steps.playwright.outputs.total > 0 }}
        shell: pwsh
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          TEST_ISSUE_KEY: "QA-1"
          TOTAL: ${{ steps.playwright.outputs.total }}
          PASSED: ${{ steps.playwright.outputs.passed }}
          FAILED: ${{ steps.playwright.outputs.failed }}
          SKIPPED: ${{ steps.playwright.outputs.skipped }}
        run: |
          $failed = [int]$env:FAILED
          $total = [int]$env:TOTAL
          $passed = [int]$env:PASSED
          
          if ($failed -gt 0) {
            $status = "FAIL"
          } else {
            $status = "PASS"
          }
          
          $passRate = if ($total -gt 0) { [math]::Round(($passed/$total)*100, 1) } else { 0 }
          
          Write-Host "Test Status: $status"
          Write-Host "Total Tests: $total"
          Write-Host "Passed: $passed"
          Write-Host "Failed: $failed"
          Write-Host "Pass Rate: $passRate%"
          
          $authBody = @{
            client_id = $env:XRAY_CLIENT_ID
            client_secret = $env:XRAY_CLIENT_SECRET
          } | ConvertTo-Json
          
          try {
            $authResponse = Invoke-RestMethod -Uri "https://eu.xray.cloud.getxray.app/api/v2/authenticate" `
              -Method Post `
              -Body $authBody `
              -ContentType "application/json" `
              -ErrorAction Stop
            
            $token = $authResponse
            Write-Host "Xray authentication successful"
            
            $testResults = @{
              testExecutionKey = $env:TEST_ISSUE_KEY
              info = @{
                summary = "Playwright E2E Test Execution - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                description = "Automated E2E test execution from GitHub Actions"
              }
              tests = @(
                @{
                  testKey = $env:TEST_ISSUE_KEY
                  status = $status
                  comment = "Playwright E2E Tests: $passed/$total passed ($passRate% success rate). Failed: $failed, Skipped: $($env:SKIPPED)"
                  examples = ""
                  steps = @()
                }
              )
            } | ConvertTo-Json -Depth 10
            
            Write-Host "Importing test results to Xray..."
            
            $importResponse = Invoke-RestMethod -Uri "https://eu.xray.cloud.getxray.app/api/v2/import/execution" `
              -Method Post `
              -Headers @{
                Authorization = "Bearer $token"
                "Content-Type" = "application/json"
              } `
              -Body $testResults `
              -ErrorAction Stop
            
            Write-Host "Test results imported to Xray successfully"
          }
          catch {
            Write-Host "Failed to update Xray: $_"
          }

      - name: Post comment to Jira
        if: ${{ steps.playwright.outputs.exists == 'true' && steps.playwright.outputs.total > 0 }}
        shell: pwsh
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_ISSUE_KEY: "QA-1"
          TOTAL: ${{ steps.playwright.outputs.total }}
          PASSED: ${{ steps.playwright.outputs.passed }}
          FAILED: ${{ steps.playwright.outputs.failed }}
          SKIPPED: ${{ steps.playwright.outputs.skipped }}
        run: |
          $total = [int]$env:TOTAL
          $passed = [int]$env:PASSED
          $failed = [int]$env:FAILED
          $skipped = [int]$env:SKIPPED
          $passRate = if ($total -gt 0) { [math]::Round(($passed/$total)*100, 1) } else { 0 }
          
          $pair = "${env:JIRA_EMAIL}:${env:JIRA_API_TOKEN}"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          
          $statusText = if ($failed -gt 0) { "FAILED" } else { "PASSED" }
          
          $commentText = "Playwright E2E Test Execution Completed - Status: $statusText`n`n"
          $commentText += "Test Summary`n`n"
          $commentText += "| Metric | Value |`n"
          $commentText += "|--------|-------|`n"
          $commentText += "| Total Tests | $total |`n"
          $commentText += "| Passed | $passed |`n"
          $commentText += "| Failed | $failed |`n"
          $commentText += "| Skipped | $skipped |`n"
          $commentText += "| Pass Rate | $passRate% |`n`n"
          $commentText += "Test Details`n`n"
          $commentText += "- Framework: Playwright (JavaScript)`n"
          $commentText += "- Test File: SauceDemo E2E Tests`n"
          $commentText += "- Execution Time: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')`n`n"
          $commentText += "Test Scenario Executed:`n"
          $commentText += "1. Login to SauceDemo`n"
          $commentText += "2. Add product to cart`n"
          $commentText += "3. View cart`n"
          $commentText += "4. Checkout process`n"
          $commentText += "5. Order verification`n`n"
          $commentText += "---`n"
          $commentText += "This test execution has been recorded in Xray.`n"
          $commentText += "Automated update from GitHub Actions"
          
          $body = @{
            body = $commentText
          } | ConvertTo-Json -Depth 10
          
          try {
            Invoke-RestMethod -Uri "$($env:JIRA_BASE_URL)/rest/api/3/issue/$($env:JIRA_ISSUE_KEY)/comment" `
              -Method Post `
              -Headers @{
                Authorization = "Basic $encoded"
                Accept = "application/json"
                "Content-Type" = "application/json"
              } `
              -Body $body `
              -ErrorAction Stop
            
            Write-Host "Comment posted to Jira successfully"
          }
          catch {
            Write-Host "Failed to post comment to Jira: $_"
          }